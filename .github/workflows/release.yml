name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

# The ed25519 public key that pro/ verifies licences against, injected at link
# time (pro/licence.go ships a development key as its default, whose private
# half is a test fixture). This half is public by construction — the private
# half exists only as an env var on the account.mimux.dev VPS. It is in plain
# sight rather than in a secret on purpose: anyone can check that the key a
# release verifies against is the one the shop signs with.
env:
  LICENCE_PUBKEY: h5RYHhjY0p/8LV9XxRo1npqclQY2LUOFWn+QH/2XIIA

jobs:
  # Gate: run the same checks as CI. The release job below only runs if this
  # passes, so a release never ships unless CI is green.
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    # Client releases only: tags look like v0.21.3. www-v* tags deploy the site
    # instead (see www.yml) and must never build or push a client image.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tailwind build
        run: |
          npm ci
          npx @tailwindcss/cli -i web/static/css/app.css -o web/static/css/dist.css --minify

      # Three kinds of image tag, and the difference between them is the whole
      # pinning story:
      #
      #   latest / pro   newest of everything, moves across minors
      #   v0.21          floating, moves with each patch of that minor — the
      #                  recommended pin, because a minor is what a licence
      #                  covers, so this receives fixes and never leaves the
      #                  thing you paid for
      #   v0.21.3        exact, never moves (0.21.3 without the v as well)
      #
      # The floating alias is emitted only for a plain numeric three-part tag.
      # ${tag%.*} on a legacy two-part v0.20 would publish an image called "v0",
      # and on a v1.0.0-rc1 it would quietly point the stable v1.0 pin at a
      # release candidate.
      - name: Compute image tags
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          img=ghcr.io/mattmezza/mimux
          free="$img:latest"$'\n'"$img:$tag"$'\n'"$img:${tag#v}"
          pro="$img:pro"$'\n'"$img:$tag-pro"$'\n'"$img:${tag#v}-pro"
          case "${tag#v}" in
            *[!0-9.]*) ;;
            *.*.*) free="$free"$'\n'"$img:${tag%.*}"; pro="$pro"$'\n'"$img:${tag%.*}-pro" ;;
          esac
          {
            echo "free<<TAGS"; echo "$free"; echo "TAGS"
            echo "pro<<TAGS";  echo "$pro";  echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          # When this release went out, linked into the binary. A perpetual
          # licence covers every build released before its window ends, and
          # this is the date that gets compared (pro/licence.go). Falls back to
          # now, which is within seconds of published_at anyway — an empty
          # value here would ship binaries that answer "unknown" and fail open.
          echo "date=$(date -u -d '${{ github.event.release.published_at }}' +%Y-%m-%d 2>/dev/null || date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Six binaries: three targets by two flavours. The pro one is the same
      # client plus the ELv2 automation layer, with the production licence key
      # linked in, and is suffixed -pro in both the filename and main.version so
      # `mimux -version` and the licence watermark agree.
      - name: Build release binaries
        run: |
          tag="${{ github.event.release.tag_name }}"
          for flavour in free pro; do
            tags=""; name=mimux; version="$tag"; pubkey=""
            if [ "$flavour" = pro ]; then
              tags=pro; name=mimux-pro; version="$tag-pro"
              pubkey=" -X github.com/mattmezza/mimux/pro.licencePubKeyB64=${LICENCE_PUBKEY}"
            fi
            for target in linux/amd64 linux/arm64 darwin/arm64; do
              GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
                go build -tags "$tags" \
                -ldflags="-s -w -X main.version=${version} -X main.buildDate=${{ steps.meta.outputs.date }}${pubkey}" \
                -o dist/$name-${target%/*}-${target#*/} ./cmd/mimux
            done
          done
          # A release that links the dev key would verify nothing anyone paid
          # for, and would do it silently. Fail loudly instead.
          #
          # Checked against buildinfo, not the raw bytes: -X overwrites the
          # value the code reads but leaves the original initializer in the
          # binary as dead data, so BOTH keys grep-match either way and a plain
          # `grep` would pass for a dev-key build too.
          go version -m dist/mimux-pro-linux-amd64 \
            | grep -qF -- "-X github.com/mattmezza/mimux/pro.licencePubKeyB64=${LICENCE_PUBKEY}" \
            || { echo "::error::pro binary was not linked against the production licence key"; exit 1; }
      - name: Attach binaries to release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.free }}

      # The pro image. Same Dockerfile, built with -tags pro and the production
      # licence key. `:pro` is the moving pointer, the way `:latest` is for free.
      - name: Build and push the pro image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.event.release.tag_name }}-pro
            BUILD_DATE=${{ steps.meta.outputs.date }}
            BUILD_TAGS=pro
            LICENCE_PUBKEY=${{ env.LICENCE_PUBKEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.pro }}
