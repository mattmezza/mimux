name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Release trigger can't wait for CI, so validate here before building.
      - name: Tailwind build
        run: |
          npm ci
          npx @tailwindcss/cli -i web/static/css/app.css -o web/static/css/dist.css --minify
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Test
        run: go test -race ./...

      - name: Build release binaries
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -ldflags="-s -w -X main.version=${{ github.event.release.tag_name }}" \
              -o dist/sm-${target%/*}-${target#*/} ./cmd/sm
          done
      - name: Attach binaries to release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: |
            ghcr.io/mattmezza/sm:${{ github.event.release.tag_name }}
            ghcr.io/mattmezza/sm:latest
