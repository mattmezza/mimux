name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  # Gate: run the same checks as CI. The release job below only runs if this
  # passes, so a release never ships unless CI is green.
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    # Client releases only: tags look like v0.19. www-v* tags deploy the site
    # instead (see www.yml) and must never build or push a client image.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tailwind build
        run: |
          npm ci
          npx @tailwindcss/cli -i web/static/css/app.css -o web/static/css/dist.css --minify

      # Image tags: v0.1 (tag), 0.1 (tag without leading v), and latest.
      - name: Compute image tags
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -ldflags="-s -w -X main.version=${{ github.event.release.tag_name }}" \
              -o dist/mimux-${target%/*}-${target#*/} ./cmd/mimux
          done
      - name: Attach binaries to release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/mattmezza/mimux:latest
            ghcr.io/mattmezza/mimux:${{ steps.meta.outputs.tag }}
            ghcr.io/mattmezza/mimux:${{ steps.meta.outputs.ver }}
