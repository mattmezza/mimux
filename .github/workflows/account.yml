name: Account

# The licence-selling service at account.mimux.dev — its own Go module, its own
# image, its own release tags. `account-v*` tags are plain git tags (no GitHub
# Release is created for them — only client v* releases show up on the
# releases page), pushed by `make release-account`, and this workflow's own
# tag-push trigger is what fires the publish job — no cross-pipeline filtering
# needed against the client's `v*` releases.
on:
  push:
    branches: [main]
    paths:
      - "account/**"
      - ".github/workflows/account.yml"
    tags: ["account-v*"]
  pull_request:
    paths:
      - "account/**"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: account/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./...

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/account-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tags
        id: meta
        run: |
          tag="${{ github.ref_name }}"
          echo "ver=${tag#account-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: account
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/mattmezza/mimux-account:latest
            ghcr.io/mattmezza/mimux-account:${{ steps.meta.outputs.ver }}
