name: Account

# The licence-selling service at account.mimux.dev — its own Go module, its own
# image, its own release tags. `account-v*` is deliberately distinct from the
# client's `v*` (whose release job requires startsWith(tag, 'v'), which an
# account-v* tag fails) so neither release fires the other's pipeline.
on:
  push:
    branches: [main]
    paths:
      - "account/**"
      - ".github/workflows/account.yml"
  pull_request:
    paths:
      - "account/**"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  test:
    # Skip client (v*) and www (www-v*) releases; run for account-v* releases
    # and for any push/PR that touched account/.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'account-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: account/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./...

  publish:
    needs: test
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'account-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tags
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "ver=${tag#account-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: account
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/mattmezza/mimux-account:latest
            ghcr.io/mattmezza/mimux-account:${{ steps.meta.outputs.ver }}
