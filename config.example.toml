# SM configuration. Copy to config.toml and edit.
# Path is taken from $SM_CONFIG or the -config flag (default: ./config.toml).

[server]
# Bind address for the web server
host = "0.0.0.0"
# Bind port
port = 8080
# Public URL for the app (used in OAuth redirects, email links, etc.).
# Must use https:// in production; http:// for local development.
# Secure cookies are enabled only when base_url uses https://.
base_url = "http://localhost:8080"
# Required: random 32+ character secret key for signing sessions and CSRF tokens.
# Generate with: openssl rand -base64 32
secret = "change-me-to-a-random-64-char-string"

[db]
# Path to SQLite database file. Created if it does not exist.
path = "./data/sm.db"

# --- Accounts ---
# Define one [[accounts]] block per email account.
#
# Provider presets (imap_host, imap_port, smtp_host, smtp_port auto-filled):
#   - "gmail" (Gmail)
#   - "zoho" (Zoho Mail)
#   - "purelymail" (PurelyMail)
#
# For other providers, set imap_host/imap_port/smtp_host/smtp_port explicitly.
#
# Auth modes:
#   - "password": username + password (or app password)
#   - "oauth2": OAuth2 flow (see README "OAuth setup" section)
#
# Default auth mode is "password" if not specified.

# Example 1: Gmail with OAuth2
# `name` is the display name used on outgoing mail (the From: header).
# `account_name` is the short label shown on the account badge and sidebar, and
# is the account's stable identity. If `account_name` is omitted, `name` is used
# for both (legacy behavior).
[[accounts]]
name = "Matteo Merola"
account_name = "gmail"
provider = "gmail"
email = "you@gmail.com"
auth = "oauth2"
# Obtain from Google Cloud Console (see README "OAuth setup" section)
oauth2_client_id = "your-client-id.apps.googleusercontent.com"
oauth2_client_secret = "your-client-secret"
# imap_host, imap_port, smtp_host, smtp_port auto-filled by gmail preset

# Example 2: Zoho Mail with OAuth2
# Note: SM uses Zoho's .com endpoints (accounts.zoho.com) by default.
# If your account is in another region (EU/IN/etc.), you must either:
# 1. Use a .com Zoho account, or
# 2. Adjust the OAuth endpoints in internal/mail/oauth.go
[[accounts]]
name = "Zoho"
provider = "zoho"
email = "you@yourcompany.com"
# Extra addresses this account can send-as and that are flagged "via <alias>"
# when a message was received on them:
# aliases = ["sales@yourcompany.com", "you+newsletter@yourcompany.com"]
auth = "oauth2"
oauth2_client_id = "your-zoho-client-id"
oauth2_client_secret = "your-zoho-client-secret"
# imap_host, imap_port, smtp_host, smtp_port auto-filled by zoho preset

# Example 3: PurelyMail with password
[[accounts]]
name = "PurelyMail"
provider = "purelymail"
email = "you@mydomain.com"
auth = "password"
# Password or app-specific password from the provider
password = "app-password-here"
# imap_host, imap_port, smtp_host, smtp_port auto-filled by purelymail preset

# Example 4: Custom provider (non-preset)
# [[accounts]]
# name = "Custom"
# email = "you@example.com"
# auth = "password"
# password = "your-password"
# imap_host = "mail.example.com"
# imap_port = 993
# smtp_host = "mail.example.com"
# smtp_port = 465

[translate]
# Google Translate API key. Required to enable message translation.
# Leave empty to disable the feature.
# Set up: Google Cloud Console → APIs & Services → Create API key
api_key = ""
# Target language code (e.g., "en", "es", "fr", "de")
# Used when translating message bodies.
target_language = "en"

[ai]
# OpenRouter API key. Required to enable AI features (e.g., AI-assisted compose/reply).
# Leave empty to disable the feature.
# Get a key from: https://openrouter.ai/
openrouter_api_key = ""
# AI model to use (via OpenRouter). Default is Claude Sonnet 4.6.
# See https://openrouter.ai/models for available options.
model = "anthropic/claude-sonnet-4-6"

[sync]
# How often to poll IMAP for new messages (when IMAP IDLE is not available).
# Formats: "5m", "30s", "1h", etc.
poll_interval = "5m"
# Maximum number of messages to sync per account per poll cycle.
# Useful to limit bandwidth/load on large mailboxes.
max_messages_per_sync = 500
