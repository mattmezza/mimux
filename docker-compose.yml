services:
  mimux:
    image: ghcr.io/mattmezza/mimux:latest
    build: .
    ports:
      - "8083:8083"
    volumes:
      - ./data:/data
    environment:
      # mimux boots with zero config; accounts and API keys are added from the
      # Settings GUI and stored in the DB. See README for the full env-var list.
      - MIMUX_DB=/data/mimux.db
      - MIMUX_BASE_URL=http://localhost:8083
      # - MIMUX_SECRET=... # optional; auto-generated and persisted to /data/secret
      - TZ=Europe/Zurich
    restart: unless-stopped
