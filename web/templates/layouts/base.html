{{define "base"}}<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18181b">
  <title>{{block "title" .}}SM — Simple Mail{{end}}</title>
  <link rel="stylesheet" href="/static/css/dist.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <script defer src="/static/js/htmx.min.js"></script>
  <!-- app.js must load before Alpine: it registers the smUI component on the
       alpine:init event, which Alpine fires the moment its own script runs. -->
  <script defer src="/static/js/app.js"></script>
  <script defer src="/static/js/alpinejs.min.js"></script>
  {{with .CSRF}}<meta name="csrf-token" content="{{.}}">{{end}}
</head>
<body class="h-screen bg-zinc-900 text-zinc-300 antialiased overflow-hidden text-sm">
<a href="#main-content" class="skip-link">Skip to content</a>
{{block "content" .}}{{end}}
<div id="compose-root"></div>
<div id="toasts" aria-live="polite" aria-atomic="false" class="fixed bottom-8 right-4 z-[60] flex flex-col gap-2 items-end pointer-events-none"></div>
</body>
</html>{{end}}
