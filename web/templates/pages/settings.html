{{define "title"}}Settings — SM{{end}}
{{define "content"}}
<div class="h-full flex flex-col">
  <header class="h-12 shrink-0 flex items-center gap-3 px-4 border-b border-zinc-800 bg-zinc-900">
    <a href="/" class="p-1.5 -ml-1.5 rounded-md text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 transition-colors duration-150" title="Back to inbox" aria-label="Back to inbox">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
    </a>
    <h1 class="text-base font-semibold text-zinc-100">Settings</h1>
  </header>
  <main class="flex-1 overflow-y-auto">
    <form method="post" action="/settings" class="max-w-2xl mx-auto w-full p-6 space-y-8">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">

      <section class="space-y-4">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-zinc-500">Reading</h2>

        <label class="block space-y-1">
          <span class="text-sm text-zinc-200">Mark as read after N seconds of viewing (0 = immediately)</span>
          <input type="number" name="mark_read_delay" min="0" value="{{.Prefs.MarkReadDelay}}"
            class="w-28 rounded-md bg-zinc-800 border border-zinc-700 px-3 py-1.5 text-zinc-100 focus:outline-none focus:border-indigo-500">
        </label>

        <label class="block space-y-1">
          <span class="text-sm text-zinc-200">Message preview lines</span>
          <input type="number" name="preview_lines" min="0" max="3" value="{{.Prefs.PreviewLines}}"
            class="w-28 rounded-md bg-zinc-800 border border-zinc-700 px-3 py-1.5 text-zinc-100 focus:outline-none focus:border-indigo-500">
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" name="show_avatar" value="1" {{if .Prefs.ShowAvatar}}checked{{end}}
            class="rounded border-zinc-600 bg-zinc-800 text-indigo-500 focus:ring-indigo-500">
          <span class="text-sm text-zinc-200">Show sender avatar</span>
        </label>
      </section>

      <section class="space-y-4">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-zinc-500">Syncing</h2>
        <label class="block space-y-1">
          <span class="text-sm text-zinc-200">Check for new mail every N minutes</span>
          <input type="number" name="sync_interval_min" min="1" value="{{.Prefs.SyncIntervalMin}}"
            class="w-28 rounded-md bg-zinc-800 border border-zinc-700 px-3 py-1.5 text-zinc-100 focus:outline-none focus:border-indigo-500">
        </label>

        <label class="block space-y-1">
          <span class="text-sm text-zinc-200">Sync history — how far back to download</span>
          <select name="sync_months"
            class="w-48 rounded-md bg-zinc-800 border border-zinc-700 px-3 py-1.5 text-zinc-100 focus:outline-none focus:border-indigo-500">
            <option value="0"{{if eq .Prefs.SyncMonths 0}} selected{{end}}>Everything (count-capped)</option>
            <option value="1"{{if eq .Prefs.SyncMonths 1}} selected{{end}}>Last 1 month</option>
            <option value="3"{{if eq .Prefs.SyncMonths 3}} selected{{end}}>Last 3 months</option>
            <option value="6"{{if eq .Prefs.SyncMonths 6}} selected{{end}}>Last 6 months</option>
            <option value="12"{{if eq .Prefs.SyncMonths 12}} selected{{end}}>Last 12 months</option>
            <option value="24"{{if eq .Prefs.SyncMonths 24}} selected{{end}}>Last 24 months</option>
          </select>
          <span class="block text-xs text-zinc-500">Applies on the next first-time sync of each folder. Already-downloaded mail stays.</span>
        </label>
      </section>

      {{if .Accounts}}
      <section class="space-y-4">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-zinc-500">Account colors</h2>
        {{range .Accounts}}
          {{$c := index $.Prefs.AccountColors .Name}}{{if not $c}}{{$c = "#6366f1"}}{{end}}
          <label class="flex items-center gap-3">
            <input type="color" name="color:{{.Name}}" value="{{$c}}"
              class="h-8 w-12 rounded-md bg-zinc-800 border border-zinc-700 cursor-pointer">
            <span class="text-sm text-zinc-200">{{.Name}}</span>
          </label>
        {{end}}
      </section>
      {{end}}

      <div class="pt-2">
        <button type="submit"
          class="px-4 py-2 rounded-md bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-medium transition-colors duration-150">Save</button>
      </div>
    </form>
  </main>
</div>
{{end}}
