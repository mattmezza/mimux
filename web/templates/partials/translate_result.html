{{define "translate_result"}}
<div data-translated-ok class="mt-2 rounded-md border border-zinc-800 bg-zinc-800/50 p-3 text-zinc-200">
  <div class="flex items-center gap-2 mb-1">
    <p class="text-[11px] uppercase tracking-wider text-zinc-500 flex-1">Translated from {{.DetectedLang}}</p>
    <button type="button" onclick="this.closest('[data-translate-result]').classList.add('hidden')"
      class="shrink-0 text-[11px] text-indigo-400 hover:text-indigo-300 transition-colors duration-150">Show original</button>
  </div>
  <p class="whitespace-pre-wrap">{{.Text}}</p>
</div>
{{end}}
{{define "translate_error"}}
<div class="mt-2 rounded-md border border-red-900/50 bg-red-950/30 p-3 text-red-300 text-xs">
  {{.Error}}
</div>
{{end}}
