{{define "templates_manager"}}
<div id="templates-manager" x-data="tmplMgr()" class="space-y-4">
  <ul class="rounded-lg border border-zinc-700 divide-y divide-zinc-800 overflow-hidden bg-zinc-800/30">
    {{range .Templates}}
    <li class="flex items-center gap-3 px-3 py-2.5">
      <span class="min-w-0 flex-1">
        <span class="block text-sm text-zinc-100 truncate">{{.Name}}</span>
        <span class="block text-xs text-zinc-500 truncate">{{.Body}}</span>
      </span>
      <button type="button" data-tpl='{{toJSON .}}' @click="edit($event.currentTarget.dataset.tpl)"
        class="shrink-0 text-xs px-2.5 py-1 rounded-md border border-zinc-700 text-zinc-300 hover:bg-zinc-700 transition-colors duration-150">Edit</button>
      <button type="button"
        hx-post="/settings/templates/{{.ID}}/delete" hx-target="#templates-manager" hx-swap="outerHTML"
        hx-confirm="Delete the template “{{.Name}}”?"
        class="shrink-0 text-xs px-2.5 py-1 rounded-md border border-zinc-700 text-zinc-400 hover:text-red-400 hover:bg-red-500/10 transition-colors duration-150">Delete</button>
    </li>
    {{else}}
    <li class="px-3 py-4 text-sm text-zinc-500">No templates yet. Add one below — it'll show up in the compose panel.</li>
    {{end}}
  </ul>

  <div x-show="!showForm">
    <button type="button" @click="startAdd()"
      class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-medium transition-colors duration-150">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      Add template
    </button>
  </div>

  {{/* add/edit form — not a <form> (settings page is one big form): posts via htmx */}}
  <div x-show="showForm" x-cloak id="tpl-fields" class="rounded-lg border border-zinc-700 bg-zinc-800/30 p-4 space-y-3">
    <h3 class="text-sm font-semibold text-zinc-100" x-text="editing ? 'Edit template' : 'Add template'"></h3>
    <input type="hidden" name="id" :value="f.id">

    <label class="block space-y-1">
      <span class="text-xs text-zinc-400">Name</span>
      <input type="text" name="name" x-model="f.name" placeholder="e.g. Meeting follow-up"
        class="w-full rounded-md bg-zinc-800 border border-zinc-700 px-3 py-1.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500">
    </label>
    <label class="block space-y-1">
      <span class="text-xs text-zinc-400">Content</span>
      <textarea name="body" x-model="f.body" rows="8"
        class="w-full font-mono text-[13px] rounded-md bg-zinc-950 border border-zinc-800 px-3 py-2 text-zinc-100 focus:outline-none focus:border-indigo-500"></textarea>
    </label>

    <div class="flex items-center gap-2 pt-1">
      <button type="button"
        hx-post="/settings/templates" hx-include="#tpl-fields" hx-target="#templates-manager" hx-swap="outerHTML"
        hx-on::after-request="if(!event.detail.successful) toast(event.detail.xhr.responseText || 'Could not save template')"
        class="px-3 py-1.5 rounded-md bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-medium transition-colors duration-150"
        x-text="editing ? 'Save template' : 'Add template'"></button>
      <button type="button" @click="cancel()"
        class="px-3 py-1.5 rounded-md border border-zinc-700 text-zinc-300 text-sm hover:bg-zinc-700 transition-colors duration-150">Cancel</button>
    </div>
  </div>
</div>
{{end}}
