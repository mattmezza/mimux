{{define "attachments"}}
{{if .Attachments}}
<div class="shrink-0 border-b border-zinc-800 px-4 py-2">
  <div class="flex flex-wrap gap-2">
    {{$mid := .MsgID}}
    {{range .Attachments}}
    <div data-attachment class="rounded-md border border-zinc-800 bg-zinc-800/40 overflow-hidden">
      <div class="flex items-center gap-2 px-2 py-1.5 text-xs">
        <svg class="w-4 h-4 shrink-0 text-zinc-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.112 2.13"/></svg>
        <span class="text-zinc-200 truncate max-w-[12rem]" title="{{.Name}}">{{.Name}}</span>
        <span class="text-zinc-500 shrink-0">{{.Size}}</span>
        {{if ne .Kind "other"}}
        <button type="button" onclick="previewAttachment(this, '/messages/{{$mid}}/attachment/{{.Part}}', '{{.Kind}}')"
          class="shrink-0 text-indigo-400 hover:text-indigo-300 transition-colors duration-150">Preview</button>
        {{end}}
        <a href="/messages/{{$mid}}/attachment/{{.Part}}?dl=1" download="{{.Name}}"
          class="shrink-0 text-zinc-400 hover:text-zinc-100 transition-colors duration-150">Download</a>
      </div>
      <div data-preview class="hidden border-t border-zinc-800 p-2"></div>
    </div>
    {{end}}
  </div>
</div>
{{end}}
{{end}}
