{{define "filter_row"}}
<div class="rounded-md border border-zinc-800 bg-zinc-800/30 px-3 py-2 flex items-center gap-3{{if not .Enabled}} opacity-50{{end}}">
  <div class="flex flex-col gap-0.5 shrink-0">
    <form method="post" action="/filters/reorder">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <input type="hidden" name="ids" value="{{.UpIDs}}">
      <button type="submit" title="Move up" aria-label="Move rule up" {{if not .UpIDs}}disabled{{end}} class="text-zinc-500 hover:text-zinc-200 disabled:opacity-30 leading-none text-xs">▲</button>
    </form>
    <form method="post" action="/filters/reorder">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <input type="hidden" name="ids" value="{{.DownIDs}}">
      <button type="submit" title="Move down" aria-label="Move rule down" {{if not .DownIDs}}disabled{{end}} class="text-zinc-500 hover:text-zinc-200 disabled:opacity-30 leading-none text-xs">▼</button>
    </form>
  </div>

  <div class="flex-1 min-w-0">
    <p class="text-zinc-100 font-medium truncate">
      {{.Name}}{{if .Account}} <span class="text-zinc-500 font-normal">— {{acctLabel .Account}}</span>{{end}}
    </p>
    <p class="text-zinc-500 text-xs truncate">
      {{range $i, $c := .Conditions}}{{if $i}} and {{end}}{{$c.Field}} {{$c.Op}} &#34;{{$c.Value}}&#34;{{end}}
      &rarr;
      {{range $i, $a := .Actions}}{{if $i}}, {{end}}{{$a.Type}}{{if $a.Arg}} ({{$a.Arg}}){{end}}{{end}}
    </p>
  </div>

  <form method="post" action="/filters/{{.ID}}/toggle">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <button class="text-xs px-2 py-1 rounded-md border border-zinc-700 text-zinc-300 hover:bg-zinc-800 transition-colors duration-150">{{if .Enabled}}Disable{{else}}Enable{{end}}</button>
  </form>
  <a href="/filters?edit={{.ID}}" class="text-xs px-2 py-1 rounded-md border border-zinc-700 text-zinc-300 hover:bg-zinc-800 transition-colors duration-150">Edit</a>
  <form method="post" action="/filters/{{.ID}}/delete" onsubmit="return confirm('Delete this rule?')">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <button class="text-xs px-2 py-1 rounded-md border border-zinc-700 text-red-400 hover:bg-red-500/10 transition-colors duration-150">Delete</button>
  </form>
</div>
{{end}}
