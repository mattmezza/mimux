{{define "translate_button"}}
<div class="translate-widget">
  <form hx-post="/translate" hx-target="#translate-result-{{.ID}}" hx-swap="innerHTML" class="inline">
    <input type="hidden" name="text" value="{{.Text}}">
    <button type="submit" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors duration-150 inline-flex items-center gap-1">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 21l5.25-11.25L21 21m-9-3.75h7.5M3 5.621a48.474 48.474 0 0 1 6-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m6.334-12.138a24.007 24.007 0 0 1 4.877 8.855M11.667 5.25c1.598 1.058 4.312 1.5 6.833 1.5"/></svg>
      Translate
    </button>
  </form>
  <div id="translate-result-{{.ID}}"></div>
</div>
{{end}}
