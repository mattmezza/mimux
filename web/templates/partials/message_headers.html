{{define "message_headers"}}
<div class="fixed inset-0 z-[70] bg-zinc-950/75 flex items-center justify-center p-3 sm:p-6"
     role="dialog" aria-modal="true" aria-labelledby="source-headers-title"
     data-source-modal onclick="if(event.target===this)closeSourceModal()">
  <div class="flex max-h-[88vh] w-full max-w-3xl flex-col overflow-hidden rounded-xl border border-zinc-700 bg-zinc-900 shadow-2xl">
    <div class="flex shrink-0 items-center gap-3 border-b border-zinc-800 px-4 py-3">
      <h2 id="source-headers-title" class="min-w-0 flex-1 text-sm font-semibold text-zinc-100">Message headers</h2>
      <button type="button" onclick="copyMessageHeaders()" class="rounded-md px-2.5 py-1.5 text-xs text-indigo-300 hover:bg-zinc-800 hover:text-indigo-200">Copy all</button>
      <button type="button" onclick="closeSourceModal()" title="Close (Esc)" aria-label="Close message headers"
        class="rounded-md p-1.5 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <pre data-message-headers tabindex="0" class="m-0 overflow-auto whitespace-pre-wrap break-words p-4 font-mono text-[11px] leading-relaxed text-zinc-300 select-text">{{.Raw}}</pre>
  </div>
</div>
{{end}}
