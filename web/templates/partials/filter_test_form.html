{{define "filter_test_form"}}
<form method="post" action="/filters/{{.ID}}/test" class="rounded-lg border border-zinc-800 bg-zinc-800/20 p-4 space-y-3">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500">Dry run — test a sample message against this rule</span>
  <div class="grid grid-cols-2 gap-2">
    <input name="from" placeholder="From" class="rounded-md bg-zinc-900 border border-zinc-700 px-2 py-1.5 text-zinc-100 text-xs focus:outline-none focus:border-indigo-500">
    <input name="to" placeholder="To" class="rounded-md bg-zinc-900 border border-zinc-700 px-2 py-1.5 text-zinc-100 text-xs focus:outline-none focus:border-indigo-500">
    <input name="subject" placeholder="Subject" class="rounded-md bg-zinc-900 border border-zinc-700 px-2 py-1.5 text-zinc-100 text-xs focus:outline-none focus:border-indigo-500">
    <input name="body" placeholder="Body" class="rounded-md bg-zinc-900 border border-zinc-700 px-2 py-1.5 text-zinc-100 text-xs focus:outline-none focus:border-indigo-500">
  </div>
  <button class="rounded-md border border-zinc-700 hover:bg-zinc-800 transition-colors duration-150 text-zinc-200 px-3 py-1.5 text-xs">Test</button>
</form>
{{end}}
