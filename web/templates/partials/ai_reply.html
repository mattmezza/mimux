{{define "ai_reply_form"}}
<form hx-post="/ai/reply" hx-target="#ai-reply-result" hx-swap="innerHTML" class="space-y-2">
  <input type="hidden" name="context" value="{{.ThreadContext}}">
  <input type="text" name="instructions" placeholder="Anything specific to say? (optional)"
         class="w-full rounded-md bg-zinc-800 border border-transparent focus:border-indigo-500 px-3 py-1.5 text-zinc-100 placeholder-zinc-500 focus:outline-none transition-colors duration-150">
  <button type="submit" class="rounded-md bg-indigo-500 hover:bg-indigo-400 transition-colors duration-150 text-white text-xs font-medium px-3 py-1.5">
    Draft reply with AI
  </button>
</form>
<div id="ai-reply-result"></div>
{{end}}
{{define "ai_reply_result"}}
<div class="mt-2 rounded-md border border-zinc-800 bg-zinc-800/50 p-3 space-y-2">
  <textarea class="w-full min-h-[10rem] rounded-md bg-zinc-900 border border-zinc-800 focus:border-indigo-500 px-2 py-1.5 text-zinc-100 focus:outline-none transition-colors duration-150">{{.Draft}}</textarea>
  <button type="button" class="ai-insert-draft rounded-md bg-indigo-500 hover:bg-indigo-400 transition-colors duration-150 text-white text-xs font-medium px-3 py-1.5">
    Insert draft
  </button>
</div>
{{end}}
{{define "ai_reply_error"}}
<div class="mt-2 rounded-md border border-red-900/50 bg-red-950/30 p-3 text-red-300 text-xs">
  {{.Error}}
</div>
{{end}}
