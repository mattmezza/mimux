{{define "about-overlay"}}
<div id="about-overlay" hidden
     class="fixed inset-0 z-50 bg-zinc-950/70 flex items-center justify-center p-4"
     onclick="this.hidden = true">
  <div class="bg-zinc-800 rounded-lg shadow-lg p-6 w-full max-w-sm" onclick="event.stopPropagation()">
    <h2 class="text-zinc-100 font-semibold mb-4">About mimux</h2>
    <div class="space-y-3 text-xs text-zinc-400">
      <div>
        <p class="text-zinc-300 font-semibold mb-1">mimux</p>
        <p>A self-hosted email client built with Go and htmx.</p>
      </div>
      <div>
        <p class="text-zinc-300 font-semibold mb-1">Version</p>
        <p><a href="https://github.com/mattmezza/mimux/releases/tag/{{.Version}}" target="_blank" rel="noopener" class="text-blue-400 hover:text-blue-300">{{.Version}}</a></p>
      </div>
      <div>
        <p class="text-zinc-300 font-semibold mb-1">Author</p>
        <p>Matteo Merola</p>
      </div>
      <div>
        <p class="text-zinc-300 font-semibold mb-1">Repository</p>
        <p><a href="https://github.com/mattmezza/mimux" target="_blank" rel="noopener" class="text-blue-400 hover:text-blue-300">github.com/mattmezza/mimux</a></p>
      </div>
      <div>
        <p class="text-zinc-300 font-semibold mb-1">License</p>
        <p>MIT</p>
      </div>
    </div>
  </div>
</div>
{{end}}
