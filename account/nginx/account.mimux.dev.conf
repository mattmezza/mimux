# Host nginx vhost for the mimux licence shop (account/).
#
# Install: sudo cp nginx/account.mimux.dev.conf /etc/nginx/sites-available/
#          sudo ln -s ../sites-available/account.mimux.dev.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d account.mimux.dev   (rewrites this file for 443)
#
# This file is the pre-certbot version: port 80 only. Certbot adds the 443
# server block, the certificate lines and the http->https redirect in place.

server {
    listen 80;
    listen [::]:80;
    server_name account.mimux.dev;

    # Stripe webhook bodies are small; so is everything else here. The default
    # 1m is already generous — cap it rather than leave the door wide.
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:9999;   # compose binds this to loopback only
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The per-IP rate limiter on /retrieve reads X-Forwarded-For. nginx
        # appends the real peer to whatever the client sent, so the LAST value
        # is trustworthy; the app must not trust the first. The container port
        # is loopback-bound precisely so this header cannot be forged directly.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
